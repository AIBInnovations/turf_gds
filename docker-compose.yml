services:
  mongo:
    image: mongo:8
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mongo-init:
    image: mongo:8
    depends_on: [mongo]
    restart: "no"
    entrypoint: ["bash","-c","sleep 5 && mongosh --host mongo:27017 --eval 'try{rs.status()}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]})}'"]
volumes:
  mongo-data:
