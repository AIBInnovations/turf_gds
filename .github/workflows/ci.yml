name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1})' && break || sleep 2; done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
